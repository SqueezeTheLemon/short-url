[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
# router: 숫자가 아닌 미지의 경로에 "페이지 없음" 화면을 보여줘요.
dioxus = { version = "0.7", features = ["web", "router"] }
# 상대경로(`/api/links`)로 fetch 할 수 있어서 gloo-net을 써요.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard"] }
# 클립보드 Promise를 async로 기다리고, "복사됨!"을 잠깐 보여준 뒤 지우는 데 써요.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
